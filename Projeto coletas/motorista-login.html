<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Área do motorista</title>
<style>
  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    margin: 0;
    padding: 24px 16px;
    color: #f5f3ff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #0a0713;
    background-image:
      radial-gradient(ellipse 60% 45% at 50% 8%, rgba(168,120,255,0.55), transparent 60%),
      radial-gradient(ellipse 55% 40% at 8% 95%, rgba(124,58,237,0.35), transparent 65%),
      radial-gradient(ellipse 55% 40% at 95% 90%, rgba(76,29,149,0.4), transparent 65%);
    background-repeat: no-repeat;
    overflow-x: hidden;
  }

  .card {
    position: relative;
    max-width: 380px;
    width: 100%;
    background: linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.03));
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 20px;
    padding: 36px 28px 32px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.15);
  }

  .marca {
    text-align: center;
    margin: 0 0 28px;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 0.02em;
    white-space: nowrap;
    background: linear-gradient(135deg, #ffffff 0%, #d8c8ff 55%, #a683ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  h1 {
    font-size: 21px;
    font-weight: 700;
    margin: 0 0 4px;
    text-align: center;
    color: #ffffff;
  }

  p.subtitle {
    font-size: 13px;
    color: rgba(245,243,255,0.55);
    text-align: center;
    margin: 0 0 26px;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 16px 0 6px;
    color: rgba(245,243,255,0.75);
  }

  input {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    color: #ffffff;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 10px;
    transition: border-color 0.15s, background 0.15s;
  }

  input::placeholder { color: rgba(245,243,255,0.35); }

  input:focus {
    outline: none;
    border-color: #b794ff;
    background: rgba(255,255,255,0.1);
    box-shadow: 0 0 0 3px rgba(167,139,250,0.25);
  }

  button {
    width: 100%;
    margin-top: 26px;
    padding: 13px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: #fff;
    background: linear-gradient(135deg, #9061f9, #6d28d9);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(109,40,217,0.45);
    transition: filter 0.15s, transform 0.05s;
  }

  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(1px); }

  button:disabled {
    background: linear-gradient(135deg, #6d5a99, #4c3d73);
    cursor: not-allowed;
    box-shadow: none;
  }

  #erro {
    margin-top: 14px;
    font-size: 13px;
    color: #fca5a5;
    text-align: center;
    display: none;
  }

  #aviso-inatividade {
    margin-top: 14px;
    font-size: 13px;
    color: #fde68a;
    background: rgba(253,230,138,0.12);
    border: 1px solid rgba(253,230,138,0.25);
    padding: 10px;
    border-radius: 10px;
    text-align: center;
    display: none;
  }
</style>
</head>
<body>

<div class="card">
  <p class="marca">FleetCo Logística</p>
  <h1>Área do motorista</h1>
  <p class="subtitle">Entre para ver suas coletas do dia.</p>

  <form id="form-login">
    <label for="placa">Placa do veículo</label>
    <input type="text" id="placa" placeholder="ABC1D23" maxlength="7" required autocomplete="username" style="text-transform:uppercase;">

    <label for="senha">Senha</label>
    <input type="password" id="senha" placeholder="••••••••" required autocomplete="current-password">

    <button type="submit" id="btn-entrar">Entrar</button>
  </form>

  <div id="erro"></div>
  <div id="aviso-inatividade">Sua sessão expirou por inatividade. Faça login novamente.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://szdarwlcynzbamjodxsw.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_uiTPqOcdhAL5d0cBQorVgw_yIiismA-";

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  if (new URLSearchParams(window.location.search).get('motivo') === 'inatividade') {
    document.getElementById('aviso-inatividade').style.display = 'block';
  }

  supabaseClient.auth.getSession().then(({ data }) => {
    if (data.session) {
      window.location.href = 'painel-motorista.html';
    }
  });

  const form = document.getElementById('form-login');
  const erroDiv = document.getElementById('erro');
  const btnEntrar = document.getElementById('btn-entrar');
  const placaInput = document.getElementById('placa');

  placaInput.addEventListener('input', (e) => {
    e.target.value = e.target.value.toUpperCase();
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    erroDiv.style.display = 'none';
    btnEntrar.disabled = true;
    btnEntrar.textContent = 'Entrando...';

    const placa = document.getElementById('placa').value.trim().toUpperCase();
    const senha = document.getElementById('senha').value;

    // O login continua sendo feito por e-mail no Supabase Auth, mas o e-mail
    // é gerado automaticamente a partir da placa (mesmo padrão usado no cadastro).
    const emailGerado = `${placa.toLowerCase()}@motorista.coletas.com`;

    const { error } = await supabaseClient.auth.signInWithPassword({
      email: emailGerado,
      password: senha
    });

    btnEntrar.disabled = false;
    btnEntrar.textContent = 'Entrar';

    if (error) {
      erroDiv.textContent = 'Placa ou senha incorretos.';
      erroDiv.style.display = 'block';
      return;
    }

    window.location.href = 'painel-motorista.html';
  });
</script>

</body>
</html>

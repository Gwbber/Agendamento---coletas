<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redefinir senha - FleetCo</title>
<style>
  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    margin: 0;
    padding: 24px 16px;
    color: #f5f3ff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #0a0713;
    background-image:
      radial-gradient(ellipse 60% 45% at 50% 8%, rgba(168,120,255,0.55), transparent 60%),
      radial-gradient(ellipse 55% 40% at 8% 95%, rgba(124,58,237,0.35), transparent 65%),
      radial-gradient(ellipse 55% 40% at 95% 90%, rgba(76,29,149,0.4), transparent 65%);
    background-repeat: no-repeat;
    overflow-x: hidden;
  }

  .card {
    position: relative;
    max-width: 380px;
    width: 100%;
    background: linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.03));
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 20px;
    padding: 36px 28px 32px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.15);
  }

  .marca {
    text-align: center;
    margin: 0 0 28px;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 0.02em;
    white-space: nowrap;
    background: linear-gradient(135deg, #ffffff 0%, #d8c8ff 55%, #a683ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  h1 {
    font-size: 21px;
    font-weight: 700;
    margin: 0 0 4px;
    text-align: center;
    color: #ffffff;
  }

  p.subtitle {
    font-size: 13px;
    color: rgba(245,243,255,0.55);
    text-align: center;
    margin: 0 0 26px;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 16px 0 6px;
    color: rgba(245,243,255,0.75);
  }

  input {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    color: #ffffff;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 10px;
    transition: border-color 0.15s, background 0.15s;
  }

  input::placeholder { color: rgba(245,243,255,0.35); }

  input:focus {
    outline: none;
    border-color: #b794ff;
    background: rgba(255,255,255,0.1);
    box-shadow: 0 0 0 3px rgba(167,139,250,0.25);
  }

  button {
    width: 100%;
    margin-top: 26px;
    padding: 13px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: #fff;
    background: linear-gradient(135deg, #9061f9, #6d28d9);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(109,40,217,0.45);
    transition: filter 0.15s, transform 0.05s;
  }

  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(1px); }

  button:disabled {
    background: linear-gradient(135deg, #6d5a99, #4c3d73);
    cursor: not-allowed;
    box-shadow: none;
  }

  #erro {
    margin-top: 14px;
    font-size: 13px;
    color: #fca5a5;
    text-align: center;
    display: none;
  }

  #sucesso {
    margin-top: 14px;
    font-size: 13px;
    color: #86efac;
    text-align: center;
    display: none;
  }

  a.link-voltar {
    display: block;
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: rgba(245,243,255,0.6);
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="card">
  <p class="marca">FleetCo Logística</p>
  <h1>Redefinir senha</h1>
  <p class="subtitle" id="subtitulo">Escolha uma nova senha de acesso.</p>

  <form id="form-redefinir">
    <label for="senha">Nova senha</label>
    <input type="password" id="senha" placeholder="Mínimo 6 caracteres" required autocomplete="new-password">

    <label for="confirmar-senha">Confirmar nova senha</label>
    <input type="password" id="confirmar-senha" placeholder="Repita a nova senha" required autocomplete="new-password">

    <button type="submit" id="btn-salvar">Salvar nova senha</button>
  </form>

  <div id="erro"></div>
  <div id="sucesso"></div>
  <a href="login.html" class="link-voltar">Voltar para o login</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://szdarwlcynzbamjodxsw.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_uiTPqOcdhAL5d0cBQorVgw_yIiismA-";

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById('form-redefinir');
  const erroDiv = document.getElementById('erro');
  const sucessoDiv = document.getElementById('sucesso');
  const btnSalvar = document.getElementById('btn-salvar');
  const subtitulo = document.getElementById('subtitulo');

  let sessaoValida = false;

  // O link do e-mail traz um token de recuperação na própria URL.
  // O supabase-js detecta isso sozinho e, quando termina, dispara o evento abaixo.
  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' && session) {
      sessaoValida = true;
    }
  });

  // Cobre o caso de o evento já ter disparado antes deste script "ouvir" ele
  supabaseClient.auth.getSession().then(({ data }) => {
    if (data.session) sessaoValida = true;
  });

  setTimeout(() => {
    if (!sessaoValida) {
      form.style.display = 'none';
      subtitulo.textContent = '';
      erroDiv.textContent = 'Este link é inválido ou já expirou. Solicite um novo link na tela de login.';
      erroDiv.style.display = 'block';
    }
  }, 2500);

  // Traduz o motivo real devolvido pelo Supabase, em vez de uma mensagem genérica
  function traduzirErroSenha(error) {
    const codigo = error.code || '';
    const msg = (error.message || '').toLowerCase();

    if (codigo === 'same_password' || msg.includes('different from the old password')) {
      return 'A nova senha precisa ser diferente da senha atual.';
    }
    if (codigo === 'weak_password' || msg.includes('weak') || msg.includes('should contain')) {
      const motivos = Array.isArray(error.reasons) ? error.reasons : [];
      const partes = [];
      if (motivos.includes('length')) partes.push('use mais caracteres');
      if (motivos.includes('characters')) partes.push('misture letras maiúsculas, minúsculas, números e símbolos');
      if (motivos.includes('pwned')) partes.push('essa senha já apareceu em vazamentos conhecidos, escolha outra');
      return 'Senha muito fraca' + (partes.length ? ': ' + partes.join('; ') : '. Escolha uma senha mais forte') + '.';
    }
    if (codigo === 'session_not_found' || codigo === 'session_expired' || msg.includes('session') || msg.includes('not authenticated') || msg.includes('jwt')) {
      return 'O link expirou ou já foi usado. Volte ao login e peça um novo link.';
    }
    if (codigo === 'over_request_rate_limit' || error.status === 429) {
      return 'Muitas tentativas seguidas. Aguarde um minuto e tente novamente.';
    }
    return 'Não foi possível atualizar a senha' + (error.message ? ' (' + error.message + ')' : '') + '.';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    erroDiv.style.display = 'none';
    sucessoDiv.style.display = 'none';

    const senha = document.getElementById('senha').value;
    const confirmarSenha = document.getElementById('confirmar-senha').value;

    if (senha.length < 6) {
      erroDiv.textContent = 'A senha precisa ter pelo menos 6 caracteres.';
      erroDiv.style.display = 'block';
      return;
    }
    if (senha !== confirmarSenha) {
      erroDiv.textContent = 'As senhas não coincidem.';
      erroDiv.style.display = 'block';
      return;
    }
    if (!sessaoValida) {
      erroDiv.textContent = 'Este link é inválido ou já expirou. Solicite um novo link na tela de login.';
      erroDiv.style.display = 'block';
      return;
    }

    btnSalvar.disabled = true;
    btnSalvar.textContent = 'Salvando...';

    const { error } = await supabaseClient.auth.updateUser({ password: senha });

    btnSalvar.disabled = false;
    btnSalvar.textContent = 'Salvar nova senha';

    if (error) {
      erroDiv.textContent = traduzirErroSenha(error);
      erroDiv.style.display = 'block';
      console.error(error);
      return;
    }

    form.style.display = 'none';
    subtitulo.textContent = '';
    sucessoDiv.textContent = 'Senha atualizada com sucesso! Redirecionando para o login...';
    sucessoDiv.style.display = 'block';

    await supabaseClient.auth.signOut();
    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta coleta</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    margin: 0;
    padding: 60px 16px 24px;
    color: #f5f3ff;
    background: #0a0713;
    background-image:
      radial-gradient(ellipse 60% 45% at 50% 0%, rgba(168,120,255,0.4), transparent 60%),
      radial-gradient(ellipse 55% 40% at 8% 100%, rgba(124,58,237,0.28), transparent 65%),
      radial-gradient(ellipse 55% 40% at 95% 100%, rgba(76,29,149,0.32), transparent 65%);
    background-repeat: no-repeat;
    background-attachment: fixed;
  }
  .card {
    max-width: 560px;
    margin: 0 auto;
    background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.04));
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 12px;
    padding: 28px 24px 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .logo {
    display: block;
    max-height: 56px;
    margin: 0 auto 20px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
    text-align: center;
    color: #f5f3ff;
  }
  p.subtitle {
    font-size: 14px;
    color: rgba(245,243,255,0.6);
    margin: 0 0 24px;
    text-align: center;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin: 0 0 6px;
    color: rgba(245,243,255,0.75);
  }
  .linha-busca {
    display: flex;
    gap: 8px;
  }
  input {
    flex: 1;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    background: rgba(255,255,255,0.06);
    color: #f5f3ff;
  }
  input::placeholder {
    color: rgba(245,243,255,0.35);
  }
  input:focus {
    outline: none;
    border-color: #a878ff;
    box-shadow: 0 0 0 3px rgba(168,120,255,0.25);
  }
  button {
    padding: 10px 18px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #7c3aed, #a878ff);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:disabled { background: rgba(124,58,237,0.4); cursor: not-allowed; }
  .erro {
    margin-top: 14px;
    font-size: 13px;
    color: #fca5a5;
    text-align: center;
    display: none;
  }
  .resultados { margin-top: 24px; }
  .item {
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.03);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .item-topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .item-data {
    font-weight: 700;
    font-size: 14px;
    color: #f5f3ff;
  }
  .item-detalhe {
    font-size: 13px;
    color: rgba(245,243,255,0.55);
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .st-pendente { background: #fef3c7; color: #92400e; }
  .st-reagendar { background: #fef3c7; color: #92400e; }
  .st-confirmado { background: #ede9fe; color: #5b21b6; }
  .st-coletado { background: #d1fae5; color: #065f46; }
  .st-cancelado { background: #fee2e2; color: #991b1b; }
  .vazio { text-align: center; color: rgba(245,243,255,0.55); font-size: 14px; padding: 20px 0; }
  .voltar { display: block; text-align: center; margin-top: 20px; font-size: 13px; color: rgba(245,243,255,0.5); text-decoration: none; }
</style>
</head>
<body>

<div class="card">
  <img src="logo-fleetco.png" alt="FleetCo Logística" class="logo">
  <h1>Consulta coleta</h1>
  <p class="subtitle">Informe o CNPJ para ver as coletas solicitadas.</p>

  <form id="form-consulta">
    <label for="cnpj-consulta">CNPJ</label>
    <div class="linha-busca">
      <input type="text" id="cnpj-consulta" placeholder="00.000.000/0000-00" maxlength="18" required>
      <button type="submit" id="btn-consultar">Consultar</button>
    </div>
  </form>

  <div class="erro" id="erro"></div>

  <div class="resultados" id="resultados"></div>

  <a href="agendamento-coleta.html" class="voltar">← Voltar ao agendamento</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://szdarwlcynzbamjodxsw.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_uiTPqOcdhAL5d0cBQorVgw_yIiismA-";

  // Página pública: nunca reaproveita sessão salva no navegador
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false, autoRefreshToken: false }
  });

  const form = document.getElementById('form-consulta');
  const cnpjInput = document.getElementById('cnpj-consulta');
  const erroDiv = document.getElementById('erro');
  const resultadosDiv = document.getElementById('resultados');
  const btnConsultar = document.getElementById('btn-consultar');

  function limparCNPJ(v) {
    return v.replace(/\D/g, '');
  }

  function formatarCNPJInput(v) {
    v = limparCNPJ(v).slice(0, 14);
    v = v.replace(/^(\d{2})(\d)/, '$1.$2');
    v = v.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
    v = v.replace(/\.(\d{3})(\d)/, '.$1/$2');
    v = v.replace(/(\d{4})(\d)/, '$1-$2');
    return v;
  }

  cnpjInput.addEventListener('input', (e) => {
    e.target.value = formatarCNPJInput(e.target.value);
  });

  function formatarData(dataStr) {
    const [ano, mes, dia] = dataStr.split('-');
    return `${dia}/${mes}/${ano}`;
  }

  const rotuloStatus = {
    pendente: 'Pendente',
    reagendar: 'Reagendar coleta',
    confirmado: 'Confirmado',
    coletado: 'Coletado',
    cancelado: 'Cancelado'
  };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    erroDiv.style.display = 'none';
    resultadosDiv.innerHTML = '';

    const cnpjLimpo = limparCNPJ(cnpjInput.value);
    if (cnpjLimpo.length !== 14) {
      erroDiv.textContent = 'Informe um CNPJ válido (14 dígitos).';
      erroDiv.style.display = 'block';
      return;
    }

    btnConsultar.disabled = true;
    btnConsultar.textContent = 'Consultando...';

    const { data, error } = await supabaseClient.rpc('listar_agendamentos_por_cnpj', { p_cnpj: cnpjLimpo });

    btnConsultar.disabled = false;
    btnConsultar.textContent = 'Consultar';

    if (error) {
      erroDiv.textContent = 'Não foi possível consultar agora. Tente novamente.';
      erroDiv.style.display = 'block';
      console.error(error);
      return;
    }

    if (!data || data.length === 0) {
      resultadosDiv.innerHTML = '<div class="vazio">Nenhuma coleta encontrada para esse CNPJ.</div>';
      return;
    }

    resultadosDiv.innerHTML = data.map(item => `
      <div class="item">
        <div class="item-topo">
          <span class="item-data">${formatarData(item.data_coleta)}</span>
          <span class="badge st-${item.status}">${rotuloStatus[item.status] || item.status}</span>
        </div>
        <div class="item-detalhe">
          <span>${item.nome_empresa || '-'}</span>
          <span>${item.quantidade_volumes ?? '-'} volumes</span>
          <span>${item.peso_kg ?? '-'} kg</span>
          ${item.placa_veiculo ? `<span>Veículo: ${item.placa_veiculo}${item.motorista_nome ? ' — ' + item.motorista_nome : ''}</span>` : ''}
        </div>
      </div>
    `).join('');
  });
</script>

</body>
</html>
